# Hophio 1.2: FlixBus coaches through Estonia. Every morning: download Flix's open
# timetable for all of Europe (~33 MB, ODbL), keep only the trips that stop in Estonia
# (tools/flix_filter.py, ~30 KB) and commit feeds/flix-ee.zip when it changed. The app
# downloads that small file (config/v1/feeds.json, id "flix"). A failed run e-mails the owner.
name: Build FlixBus feed

on:
  schedule:
    - cron: "47 4 * * *"   # 04:47 UTC, before the daily feed check (05:17)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter
        run: |
          curl -fsSL --retry 3 -A "Hophio-feed-build/1.0" -o /tmp/flix.zip https://gtfs.gis.flix.tech/gtfs_generic_eu.zip
          python3 -I tools/flix_filter.py /tmp/flix.zip /tmp/flix-ee.zip | tee /tmp/report.txt
          # Fewer than 100 runs through Estonia (228 in Nov 2026): keep yesterday's file.
          trips=$(sed -n 's/^trips \([0-9]*\).*/\1/p' /tmp/report.txt)
          if [ "${trips:-0}" -lt 100 ]; then echo "only $trips trips - not replacing"; exit 1; fi
      - name: Commit when changed
        run: |
          # The zip carries file dates; compare what is inside instead.
          same=$(python3 -I - <<'PY'
          import zipfile, sys
          try:
              a, b = zipfile.ZipFile("feeds/flix-ee.zip"), zipfile.ZipFile("/tmp/flix-ee.zip")
          except FileNotFoundError:
              print(0); sys.exit()
          strip = lambda z: {n: z.read(n) for n in z.namelist() if n != "feed_info.txt"}
          print(int(strip(a) == strip(b)))
          PY
          )
          if [ "$same" = "1" ]; then echo "no change"; exit 0; fi
          mkdir -p feeds && cp /tmp/flix-ee.zip feeds/flix-ee.zip
          git config user.name "hophio-bot"
          git config user.email "hophio-bot@users.noreply.github.com"
          git add feeds/flix-ee.zip
          git commit -m "FlixBus feed $(date -u +%Y-%m-%d)"
          git push
