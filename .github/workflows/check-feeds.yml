# Hophio 1.1 step 4: every morning, check every timetable source the app uses.
# Reads the live config from this site (config/v1/feeds.json), downloads each feed and its
# fallbacks, and fails the run if one is broken. GitHub e-mails the owner about a failed
# scheduled run - that e-mail is the alarm. Nothing here changes the site.
name: Check timetable sources

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC = 07:17 / 08:17 Tallinn
  workflow_dispatch: {}     # "Run workflow" button for a check by hand

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check feeds and config
        shell: python
        run: |
          import csv, datetime, hashlib, io, json, sys, urllib.request, zipfile

          SITE = "https://hophioapp.github.io/config/v1/"
          # Floor per feed: about half of what each had when this was written (Nov 2026).
          # Fewer trips than this = the source lost half its network. A feed missing here: only "> 0".
          MIN_TRIPS = {"tln": 10000,
                       "harju": 6000,
                       "elron": 900,
                       "tartu": 2450,
                       "parnu": 2350,
                       "narva": 750,
                       "kohtla_jarve": 700,
                       "rakvere": 150,
                       "tartumaa": 1100,
                       "parnumaa": 2400,
                       "ida_viru": 1250,
                       "laane_virumaa": 1550,
                       "viljandimaa": 1150,
                       "vorumaa": 1000,
                       "polvamaa": 1400,
                       "valgamaa": 500,
                       "jogevamaa": 650,
                       "jarvamaa": 550,
                       "raplamaa": 650,
                       "saaremaa": 550,
                       "hiiumaa": 200,
                       "laanemaa": 450,
                       "tslaevad": 8400,
                       "kaugliinid": 1400}
          REQUIRED = ["agency.txt", "stops.txt", "routes.txt", "trips.txt", "stop_times.txt"]
          WARN_DAYS = 5   # timetable ends within this many days

          def get(url, limit=300 * 1024 * 1024):
              req = urllib.request.Request(url, headers={"User-Agent": "Hophio-feed-check/1.0"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  if r.status != 200:
                      raise RuntimeError(f"HTTP {r.status}")
                  return r.read(limit)

          problems, report = [], []

          # 1. The config itself: every file the manifest lists is there with the same hash.
          try:
              manifest = json.loads(get(SITE + "manifest.json"))
              for name, h in manifest["files"].items():
                  if hashlib.sha256(get(SITE + name)).hexdigest() != h.lower():
                      problems.append(f"config: {name} differs from manifest.json")
              get(SITE + "manifest.sig")
              feeds = json.loads(get(SITE + "feeds.json"))["feeds"]
              report.append(f"config serial {manifest['serial']}: OK")
          except Exception as e:
              print(f"::error::config on the site is unreadable: {e}")
              sys.exit(1)

          def last_service_day(z):
              days = []
              if "calendar.txt" in z.namelist():
                  for row in csv.DictReader(io.TextIOWrapper(z.open("calendar.txt"), "utf-8-sig")):
                      days.append(row.get("end_date", ""))
              if "calendar_dates.txt" in z.namelist():
                  for row in csv.DictReader(io.TextIOWrapper(z.open("calendar_dates.txt"), "utf-8-sig")):
                      if row.get("exception_type", "").strip() == "1":
                          days.append(row.get("date", ""))
              days = [d.strip() for d in days if len(d.strip()) == 8]
              return datetime.datetime.strptime(max(days), "%Y%m%d").date() if days else None

          def check(fid, url):
              data = get(url)
              z = zipfile.ZipFile(io.BytesIO(data))
              names = set(n.lower() for n in z.namelist())
              missing = [f for f in REQUIRED if f not in names]
              if missing:
                  return f"missing {', '.join(missing)}"
              if "calendar.txt" not in names and "calendar_dates.txt" not in names:
                  return "no calendar"
              trips = sum(1 for line in z.open("trips.txt") if line.strip()) - 1
              floor = MIN_TRIPS.get(fid, 1)
              if trips < floor:
                  return f"only {trips} trips (expected at least {floor})"
              end = last_service_day(z)
              today = datetime.date.today()
              if end is None:
                  return "calendar has no dates"
              if end < today + datetime.timedelta(days=WARN_DAYS):
                  return f"timetable ends {end}"
              report.append(f"{fid} {url}: {len(data) // 1024} KB, {trips} trips, runs until {end}")
              return None

          for f in feeds:
              urls = [f["url"]] + f.get("fallbackURLs", [])
              ok = False
              for u in urls:
                  try:
                      why = check(f["id"], u)
                  except Exception as e:
                      why = f"{type(e).__name__}: {e}"
                  if why is None:
                      ok = True
                  else:
                      problems.append(f"{f['id']} {u}: {why}")
              if not ok:
                  problems.append(f"{f['id']}: NO working address - the app keeps its saved copy, which will age")

          print("\n".join(report))
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
