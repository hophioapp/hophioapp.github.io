<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOPHIO · Tallinn transport, live</title>
<meta name="description" content="HOPHIO shows every tram, trolleybus and bus in Tallinn moving live, tells you when yours comes and when to get off.">
<link rel="icon" href="media/apps/hophio.png">
<link rel="apple-touch-icon" href="media/apps/hophio.png">
<!-- Link previews (Telegram, WhatsApp, Messages, Messenger): the address must be absolute. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="HOPHIO">
<meta property="og:url" content="https://hophioapp.github.io/">
<meta property="og:title" content="HOPHIO · Tallinn transport, live">
<meta property="og:description" content="Every tram, trolleybus and bus in Tallinn moving live. When yours comes, and when to get off.">
<meta property="og:image" content="https://hophioapp.github.io/media/og/site.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- tokens (as on the studio landing) ---------- */
:root{
  --paper:#ffffff; --ink:#000000; --mist:#f2f2f4; --card:#f5f5f7; --stone:#6e6e73; --line:#e2e2e2; --live:#1fbf5b;
  --nav:rgba(255,255,255,.92);
  /* The app's line colours (TransitDesign) */
  --tram:#fd5f1d; --trolley:#0263d6; --bus:#00e2b4; --busInk:#052921; --county:#8b5cf6; --night:#2443c4; --train:#fd5f1d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#000000; --ink:#f5f5f7; --mist:#141416; --card:#111113; --stone:#98989d; --line:#26262a; --nav:rgba(0,0,0,.88);
}}
:root[data-theme="dark"]{
  --paper:#000000; --ink:#f5f5f7; --mist:#141416; --card:#111113; --stone:#98989d; --line:#26262a; --nav:rgba(0,0,0,.88);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Onest",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;transition:background-color .5s,color .5s}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
/* Apple's symbols (exported from the app's own set), tinted by colour */
.sym{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--s) center/contain no-repeat;mask:var(--s) center/contain no-repeat;flex:none}

/* ---------- nav ---------- */
nav{position:fixed;inset:0 0 auto 0;z-index:50;height:68px;background:var(--nav);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-weight:800;font-size:23px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:11px}
.brand i{display:inline-flex;gap:3px}
.brand i b{width:6px;height:21px;border-radius:3px;display:block}
.navlinks{display:flex;gap:34px;font-size:16px;font-weight:500}
.navlinks a{text-decoration:none;color:var(--stone);transition:color .2s}
.navlinks a:hover{color:var(--ink)}
.navr{display:flex;gap:4px;align-items:center}
.lang{border:0;background:transparent;color:var(--stone);font-family:inherit;font-weight:600;font-size:15px;padding:9px 11px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.lang:hover{color:var(--ink)}
.lang[aria-pressed="true"]{color:var(--ink);background:var(--mist)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;margin-left:6px}
.iconbtn:hover{background:var(--mist)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-family:inherit;font-weight:600;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:18px 30px;font-size:18px;text-decoration:none;letter-spacing:-.01em;
  transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover{transform:scale(1.03)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:120px;padding-bottom:80px}
.hero h1{font-size:clamp(48px,8.4vw,119px);line-height:.95;letter-spacing:-.055em;font-weight:800}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.17em;margin-bottom:-.1em}
/* "Весь транспорт" is the longest first line: a little smaller so it clears the story */
.hero h1 .ln>span{display:block;transform:translateY(105%);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 .ln:nth-child(2)>span{animation-delay:.12s}
.hero h1 .ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{to{transform:none}}
.paint{background:linear-gradient(100deg,var(--tram) 0%,#ff9f43 25%,var(--bus) 55%,var(--trolley) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-foot{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:center;margin-top:44px;opacity:0;animation:fade 1s .7s forwards}
@keyframes fade{to{opacity:1}}
.hero-foot p{font-size:clamp(19px,1.6vw,23px);color:var(--stone);max-width:30ch;line-height:1.4}
.hero-foot p b{color:var(--ink);font-weight:500}
.status{display:inline-flex;align-items:center;gap:10px;font-size:16px;color:var(--stone);margin-top:26px}
.status b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--live);opacity:.35;animation:ping 2s infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.6);opacity:0}}

/* The story on the right: a vehicle, its circle, the line, its stops. */
/* Beside the short last line and the text under it (the long first lines stay clear). */
.story{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:min(500px,34vw);aspect-ratio:1}
.story .shape{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:100px;background:var(--c);transform-origin:50% 50%}
.story .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.story .ring circle{fill:none;stroke:var(--c);stroke-width:26;stroke-linecap:round}
.story .icon{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;color:var(--c);display:grid;place-items:center}
.mi{position:relative;display:inline-block}
.mi .sym{width:100%;height:100%;display:block}
.mi .poles{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.story .icon .mi{width:100%;height:100%}
/* As in the app: a stop is a ring about three times as wide as the line. */
.story .stop{position:absolute;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--paper);border:10px solid var(--c);opacity:0}
.story .stopname{position:absolute;left:calc(50% + 40px);font-weight:700;font-size:27px;letter-spacing:-.03em;line-height:1.1;opacity:0;transform:translateY(-50%);white-space:nowrap}
.story .stopname small{display:block;font-weight:500;font-size:17px;color:var(--stone);letter-spacing:-.01em}
.story .veh{position:absolute;left:50%;top:0;height:54px;padding:0 18px 0 13px;border-radius:27px;background:var(--c);color:var(--ci);border:5px solid var(--paper);
  display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:25px;transform:translate(-50%,-50%);opacity:0;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
.story .veh .sym{width:25px;height:25px}

/* ---------- section heads ---------- */
.sec{padding:150px 0}
.sec-h{font-size:clamp(42px,6.4vw,92px);line-height:1;letter-spacing:-.05em;font-weight:800;max-width:15ch}
.sec-p{font-size:clamp(19px,1.7vw,23px);color:var(--stone);max-width:42ch;margin-top:22px;line-height:1.45}

/* ---------- how it works: cards on the left, the phone answers ---------- */
.howgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:72px;align-items:center;margin-top:64px}
.cards{display:grid;gap:8px}
.hw{position:relative;border-radius:24px;padding:20px 24px;cursor:pointer;transition:background .3s;outline:none}
.hw .t{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;letter-spacing:-.025em;color:var(--stone);transition:color .3s}
.hw .t .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mist);color:var(--stone);flex:none;transition:background .3s,color .3s}
.hw .t .ic .sym{width:21px;height:21px}
.hw .d{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.hw .d>p{overflow:hidden;font-size:18px;line-height:1.45;color:var(--stone);padding-left:54px}
.hw.on{background:var(--card)}
.hw.on .t,.hw:hover .t,.hw:focus-visible .t{color:var(--ink)}
.hw.on .t .ic{background:var(--c);color:var(--ci)}
.hw.on .d{grid-template-rows:1fr}
.hw.on .d>p{padding-top:8px}
/* A short, thick bar as wide as the icon, bottom right, as far from the edges as the icon */
.hw .bar{position:absolute;right:24px;bottom:22px;width:40px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:none}
.hw.on .bar{display:block}
.hw .bar i{display:block;height:100%;width:0;background:var(--stone);border-radius:3px}
.hw.on .d>p{padding-right:56px}
.stage{position:relative;padding:0 70px}
.phone{position:relative;height:min(660px,80svh);aspect-ratio:1206/2622;border-radius:14%/6.44%;overflow:hidden;background:#1c1c1e;
  box-shadow:0 0 0 11px #1c1c1e,0 0 0 12px #3a3a3c,0 50px 90px -30px rgba(0,0,0,.5)}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.phone img.on{opacity:1}
/* One or two things that come onto the phone for each card */
.fx{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border-radius:22px;background:var(--paper);color:var(--ink);
  font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 20px 44px -14px rgba(0,0,0,.35);border:1px solid var(--line);
  opacity:0;transform:translate(var(--fx,0),var(--fy,0)) scale(.9);transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.fx.in{opacity:1;transform:none}
.fx small{display:block;font-weight:500;font-size:14px;color:var(--stone)}
.fx .sym{width:24px;height:24px}
.fx .badge{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 8px;border-radius:15px;font-weight:800;font-size:16px}
.fx .badge .sym{width:16px;height:16px}
.fx.pin{padding:0;background:none;border:0;box-shadow:none;color:#ffcc00;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.fx.pin .sym{width:54px;height:54px}
.fx.pin.in{animation:drop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-140px);opacity:0}60%{opacity:1}}
.fx.tap{width:64px;height:64px;padding:0;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;box-shadow:none}
.fx.tap.in{animation:tap 1.4s ease-out infinite}
@keyframes tap{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
/* the app's pin */
.appin{position:relative;display:inline-block;width:40px;height:52px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.appin svg{position:absolute;inset:0;width:100%;height:100%}
.appin .sym{position:absolute;left:50%;top:35%;width:46%;height:46%;transform:translate(-50%,-50%);color:#000}
.droppin{position:absolute;z-index:3;width:11%;transform:translate(-50%,-88%);pointer-events:none;animation:pindrop 1.7s cubic-bezier(.3,1.4,.5,1) forwards}
.droppin .appin{width:100%;height:auto;aspect-ratio:40/52}
@keyframes pindrop{0%{transform:translate(-50%,-260%);opacity:0}25%{transform:translate(-50%,-88%);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-88%);opacity:0}}
/* "tap the screen" under the phone, until you do */
.tapme{position:absolute;left:50%;bottom:-58px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
  padding:10px 16px 10px 12px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;transition:opacity .4s;pointer-events:none}
.tapme i{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;position:relative}
.tapme i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:tapring 1.6s ease-out infinite}
@keyframes tapring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.3);opacity:0}}
body.tapped .tapme,.stage.big .tapme{opacity:0}
/* thanks */
.bye{margin-top:150px;text-align:center;display:flex;flex-direction:column;align-items:center}
.bye h3{font-size:clamp(34px,4.6vw,64px);letter-spacing:-.045em;line-height:1.02;margin-top:56px;color:#fff;max-width:16ch}
.bye p{color:#8d8d92;font-size:20px;margin-top:14px}
.ridecap{display:inline-flex;align-items:center;gap:14px;height:96px;padding:0 38px 0 24px;border-radius:48px;background:var(--tram);color:#fff;
  font-weight:800;font-size:52px;letter-spacing:-.02em;transform:rotate(-7deg)}
.ridecap .face{width:50px;height:50px;transition:transform .14s ease-out}
.ridecap .eyeW{transition:rx .14s ease-out,ry .14s ease-out}
.ridecap.wink .face{transform:rotate(-8deg)}
.ridecap.wink .eyeW{rx:.12px;ry:.0375px}
/* the owner's screen */
#owner{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
#owner .sheet{width:min(360px,100%);background:var(--paper);color:var(--ink);border-radius:24px;padding:22px}
#owner h3{font-size:20px;margin-bottom:14px}
#owner .r{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
#owner .r b{font-variant-numeric:tabular-nums}
#owner p{color:var(--stone);font-size:15px;margin-top:12px}
#owner a{color:var(--ink);font-weight:600}
#owner button{margin-top:16px;width:100%;border:0;border-radius:999px;padding:12px;background:var(--ink);color:var(--paper);font:inherit;font-weight:700;cursor:pointer}
/* where to tap on a screenshot */
.hot{position:absolute;z-index:2;width:15%;aspect-ratio:1;margin:-7.5% 0 0 -7.5%;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.3);
  box-shadow:0 0 0 2px rgba(0,0,0,.18),0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .3s,left .4s,top .4s;pointer-events:none}
.hot.on{opacity:1;animation:hint 1.6s ease-in-out infinite}
.hot.press{animation:press .6s ease-out forwards}
@keyframes hint{0%,100%{transform:scale(.85)}50%{transform:scale(1.05)}}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.7);background:rgba(255,255,255,.75)}100%{transform:scale(1.6);opacity:0}}
.phone{cursor:pointer}
.closebig{display:none}
/* on a phone the first tap opens it big */
body.bigphone{overflow:hidden}
.stage.big{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.stage.big .phone{height:min(78svh,720px)}
.stage.big .closebig{display:inline-flex;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:17px;padding:14px 26px;border-radius:999px;background:var(--ink);color:var(--paper)}
.stage.big .fx{display:none}
/* what comes next */
.nexts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:56px}
.nx{border-radius:28px;padding:26px 24px;background:var(--card);display:flex;flex-direction:column;gap:40px}
.nx .ic{width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.nx .ic .sym{width:28px;height:28px}
.nx h4{font-size:22px;letter-spacing:-.02em}
.nx p{color:var(--stone);margin-top:6px;font-size:16px;line-height:1.4}
/* ---------- transport ---------- */
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:70px}
.mode{border-radius:28px;padding:26px 20px 22px;background:var(--card);display:flex;flex-direction:column;gap:46px;transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s;cursor:default}
.mode .ic{width:68px;height:68px;border-radius:20px;background:var(--c);color:var(--ci,#fff);display:grid;place-items:center;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.mode .ic .mi{width:38px;height:38px}
.mode h4{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.mode p{font-size:15px;color:var(--stone);margin-top:4px}
.mode:hover{transform:translateY(-6px)}
.mode:hover .ic{transform:rotate(-8deg) scale(1.08)}
.citymap{margin-top:20px;border-radius:32px;background:var(--card);position:relative;overflow:hidden;aspect-ratio:1100/560}
.citymap svg{position:absolute;inset:0;width:100%;height:100%}
.citymap .lbl{font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.citymap .lbl.place{fill:var(--stone);font-weight:600}
.citymap .veh{filter:drop-shadow(0 0 1px rgba(0,0,0,.3))}
.citymap .lbl.sm{font-size:14px;font-weight:700;fill:#3a3a3c}
.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mapimg.dark{display:none}
:root[data-theme="dark"] .mapimg.dark{display:block}:root[data-theme="dark"] .mapimg.light{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapimg.dark{display:block}:root:not([data-theme="light"]) .mapimg.light{display:none}}
.feat{position:absolute;display:flex;align-items:center;gap:12px;width:290px;min-height:62px;padding:10px 16px;border-radius:20px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:16px;box-shadow:0 14px 30px -14px rgba(0,0,0,.3);transition:transform .35s}
.feat:hover{transform:translateY(-4px) scale(1.03)}
.feat small{display:block;color:var(--stone);font-weight:500;font-size:13px}
.feat .sym{width:22px;height:22px}
.feat .fi{flex:none;width:34px;display:grid;place-items:center}
.feat .appin{width:24px;height:31px}
.feat .badge{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px 0 6px;border-radius:12px;font-weight:800;font-size:13px}
.feat .badge .sym{width:13px;height:13px}

/* ---------- for everyone ---------- */
.rows{margin-top:70px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:56px 0;border-bottom:1px solid var(--line);align-items:center}
.row h3{font-size:clamp(32px,3.4vw,48px);letter-spacing:-.04em;font-weight:800;line-height:1.02}
.row p{font-size:clamp(18px,1.5vw,21px);color:var(--stone);line-height:1.5;max-width:30ch;margin-top:14px}
/* All four pictures one size, a little squarer */
.vis{justify-self:end;width:100%;max-width:460px;height:320px;border-radius:30px;background:var(--card);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:28px}
/* big and clear */
.zoom{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:22px;padding:16px 20px;box-shadow:0 16px 36px -18px rgba(0,0,0,.3);font-weight:700;transition:font-size .5s cubic-bezier(.2,.8,.2,1);font-size:20px}
.zoom .badge{display:inline-flex;align-items:center;gap:6px;height:1.6em;padding:0 .55em 0 .4em;border-radius:.8em;background:var(--tram);color:#fff;font-weight:800}
.zoom .badge .sym{width:.8em;height:.8em}
.zoom .min{margin-left:auto;font-size:1.5em;letter-spacing:-.03em}
.zoom .to{color:var(--stone);font-weight:600}
.zoom,.zoom>*{white-space:nowrap}
.vis.big:hover .zoom,.vis.big.pulse .zoom{font-size:27px}
.aa{position:absolute;right:22px;bottom:18px;color:var(--stone);display:flex;align-items:baseline;gap:4px;font-weight:700}
/* private */
.vault{position:relative;width:150px;height:150px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.vault .lk{color:var(--ink);overflow:visible;margin-top:8px}
/* the lock opens and snaps shut again */
.vault .shk{transform-origin:44px 30px;animation:lock 3.2s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes lock{0%,18%{transform:none}32%,62%{transform:translateY(-9px) rotate(16deg)}76%,100%{transform:none}}
.tags{position:absolute;inset:0;z-index:2;pointer-events:none}
.tags span{position:absolute;padding:8px 14px;border-radius:999px;background:var(--paper);font-weight:600;font-size:14px;color:var(--stone);border:1px solid var(--line);white-space:nowrap}
/* made for iPhone: Lock Screen activity, Dynamic Island, widget */
.vis.ios{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:14px;padding:22px;align-items:start}
.vis.ios .island{grid-column:1/-1;justify-self:center}
.vis.ios .lock{align-self:center}
.island{height:40px;min-width:126px;border-radius:20px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 14px 0 10px;transition:min-width .5s cubic-bezier(.2,.8,.2,1),height .5s,border-radius .5s;font-weight:700;font-size:15px;overflow:hidden}
.island .l{display:flex;align-items:center;gap:6px}
.island .chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:12px;background:var(--bus);color:var(--busInk);font-size:13px;font-weight:800}
.island .chip .sym{width:13px;height:13px}
.island .r{color:var(--bus);font-variant-numeric:tabular-nums}
.vis.ios:hover .island{min-width:300px}
.lock{width:100%;border-radius:22px;background:rgba(28,28,30,.94);color:#fff;padding:14px 16px;display:grid;gap:10px;box-shadow:0 20px 40px -22px rgba(0,0,0,.5)}
.lock .top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.lock .top small{color:#98989d;font-weight:500;font-size:13px;display:block}
.lock .big{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.track{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--bus);width:var(--p,30%);transition:width 1s linear}
.track b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#1c1c1e;border:3px solid #fff}
.widget{width:150px;height:150px;align-self:center;border-radius:26px;background:var(--paper);box-shadow:0 18px 40px -20px rgba(0,0,0,.4);padding:14px;display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:13px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.widget .h{display:flex;align-items:center;gap:6px;font-size:13px}
.widget .h .sym{width:13px;height:13px;color:var(--tram)}
.widget .r{display:flex;align-items:center;gap:7px}
.widget .r .n{min-width:28px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:13px;color:#fff}
.widget .r .m{margin-left:auto;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vis.ios:hover .widget{transform:rotate(-4deg) translateY(-4px)}
/* languages */
.words{font-size:clamp(34px,4vw,54px);font-weight:800;letter-spacing:-.04em;height:1.2em;overflow:hidden;position:relative;min-width:60%;text-align:center}
.words span{position:absolute;left:0;right:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}

/* ---------- why HOPHIO ---------- */
.whys{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:70px}
.why{border-radius:28px;background:var(--card);padding:30px 28px 32px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.why .ic{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:var(--c);color:var(--ci,#fff);margin-bottom:26px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.why .ic .sym{width:28px;height:28px}
.why h4{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.why p{color:var(--stone);font-size:17px;margin-top:8px;line-height:1.45}
.why:hover{transform:translateY(-5px)}
.why:hover .ic{transform:rotate(-8deg) scale(1.08)}

/* ---------- price ---------- */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:70px;max-width:900px}
.plan{border-radius:30px;padding:36px 34px;background:var(--card);display:flex;flex-direction:column;gap:18px}
.plan.plus{background:var(--ink);color:var(--paper)}
.plan .nm{font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.plan .pr{font-size:clamp(48px,5vw,72px);font-weight:800;letter-spacing:-.05em;line-height:1}
.plan .pr small{font-size:20px;font-weight:600;letter-spacing:-.01em;opacity:.6;margin-left:6px}
.plan ul{list-style:none;display:grid;gap:10px;font-size:17px}
.plan li{display:flex;gap:10px;align-items:baseline}
.plan li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;transform:translateY(-2px)}
.plan.plus li::before{background:var(--bus)}

/* ---------- other apps ---------- */
.apps-sec{background:#000;color:#f5f5f7}
.apps-sec .sec-p{color:#8d8d92}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:80px}
.app{background:#111;border-radius:28px;padding:40px 32px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:22px;transition:background .3s;text-decoration:none;color:inherit}
.app:hover{background:#161616}
.ico{width:112px;height:112px;border-radius:25px;display:block;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 50px -10px rgba(0,0,0,.8);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.app:hover .ico{transform:translateY(-6px) rotate(-3deg)}
.app h4{font-size:28px;letter-spacing:-.03em;font-weight:700}
.app p{color:#8d8d92;font-size:16px;margin-top:-14px;line-height:1.4}
.store{margin-top:auto;display:inline-flex;align-items:center;gap:8px;background:#f5f5f7;color:#000;border-radius:999px;padding:11px 19px;font-size:15px;font-weight:600;transition:transform .25s}
.app:hover .store{transform:scale(1.04)}
.store.soon{background:transparent;color:#8d8d92;box-shadow:inset 0 0 0 1.5px #2a2a2a}
.app.soon:hover .store{transform:none}
.app.dev .store .dot{margin-right:2px}
footer{background:#000;color:#8d8d92;font-size:15px;padding:0 0 64px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;border-top:1px solid #1f1f1f;padding-top:32px}
footer .data{flex-basis:100%;font-size:14px;color:#6e6e73}
footer .legal{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 26px;order:-1;margin-bottom:6px}
footer .legal a{color:#d1d1d6;text-decoration:none;font-weight:600}
footer .legal a:hover{color:#fff}

.rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- transport: the modes and a drawn city ---------- */
/* Around Viru keskus: Apple's map (a snapshot from the app, media/map, light and dark), one
   real line on it (tram T4: its shape and stops from the open timetables, media/viru.json)
   with its trams, and a few other vehicles driving their real routes around it. */
let VIRU = null, VIRUCAL = null;
async function cityMap() {
  const f = T[lang].feats;
  if (!VIRU) {
    try { VIRU = await (await fetch("media/viru.json")).json(); } catch (e) { return; }
    try { VIRUCAL = await (await fetch("media/map/site-map.json")).json(); } catch (e) { VIRUCAL = null; }
  }
  const W = 1100, H = 560, d = VIRU, [lat0, lon0] = d.center;
  // Map position → drawing: from the snapshot's two known points, else the same frame by hand.
  let P;
  if (VIRUCAL) {
    const [la1, lo1, x1, y1] = VIRUCAL.a, [la2, lo2, x2, y2] = VIRUCAL.b;
    P = (la, lo) => [x1 + (lo - lo1) / (lo2 - lo1) * (x2 - x1), y1 + (la - la1) / (la2 - la1) * (y2 - y1)];
  } else {
    const kx = 111320 * Math.cos(lat0 * Math.PI / 180) * (W / 1200), ky = 111320 * (W / 1200);
    P = (la, lo) => [W / 2 + (lo - lon0) * kx, H / 2 - (la - lat0) * ky];
  }
  const path = (pts) => "M" + pts.map(([la, lo]) => P(la, lo).map((v) => v.toFixed(1)).join(" ")).join(" L");
  const MK = { "900": "tram", "800": "trolley", "3": "bus" };
  const line = (n, dir) => d.lines.find((l) => l.name === n && l.dir === dir);
  /* Drawn the way the app draws a line you look at (TransitMapView): one line of the line's
     colour, 5 pt, round ends, nothing under it; its stops as white dots with a 2.5 pt ring
     and a 12 pt name; vehicles as the app's capsules (VehicleAnnotationView): the heading
     arrow and the number, a thin white edge. Sizes in app points (the snapshot is 1 pt per
     unit) times K, a touch bigger for a page. */
  const K = 1.2, SYS = "-apple-system,'SF Pro Text',system-ui,sans-serif";
  const t4 = line("T4", "0");
  const t4pts = t4.pts.map(([la, lo]) => P(la, lo));
  const pathXY = (q) => "M" + q.map((v) => v[0].toFixed(1) + " " + v[1].toFixed(1)).join(" L");
  const others = d.lines.filter((l) => l.name !== "T4");
  // How far a point is from the drawn line.
  const off = ([x, y]) => Math.min(...t4pts.slice(1).map((b, i) => {
    const a = t4pts[i], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / L2));
    return Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy);
  }));
  // Each stop once: the platform that is on this line.
  const stopAt = new Map();
  d.route.forEach(([n, la, lo]) => { const q = P(la, lo), o = off(q); if (!stopAt.has(n) || o < stopAt.get(n).o) stopAt.set(n, { q, o }); });
  const stopMarks = [...stopAt].map(([n, { q: [x, y] }]) =>
    `<circle cx="${x}" cy="${y}" r="${5.5 * K}" fill="var(--paper)" stroke="var(--tram)" stroke-width="${2.5 * K}"/>
     <text x="${x + 10 * K}" y="${y + 4 * K}" class="lbl" font-size="${12 * K}">${n}</text>`).join("");
  const places = Object.entries(d.labels).filter(([n]) => ["Viru keskus", "Kaubamaja"].includes(n)).map(([n, ps]) => {
    const q = ps.map(([la, lo]) => P(la, lo)), x = q.reduce((a, p) => a + p[0], 0) / q.length, y = q.reduce((a, p) => a + p[1], 0) / q.length;
    return `<text x="${x}" y="${y}" text-anchor="middle" class="lbl place" font-size="${12 * K}">${n}</text>`;
  }).join("");
  const capsule = (l, id, start, focused) => {
    const k = MK[l.type], fs = (focused ? 15 : 11) * K, txt = l.name;
    const tw = txt.length * fs * .64, vPad = Math.round(fs * .2), h = Math.round(fs * 1.2) + vPad * 2;
    const hPad = Math.max(Math.round(h * .42), 5), aw = Math.round(fs * .72), gap = Math.round(fs * .2);
    const w = Math.max(h, hPad * 2 + aw + gap + tw), ax = -w / 2 + hPad + aw / 2, r = aw / 2;
    return `<g class="veh" data-path="${id}" data-start="${start}" data-big="${focused ? 1 : ""}" opacity="0">
      <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${MODE[k].c}" stroke="#fff" stroke-width="${(focused ? 2 : 1) * K}"/>
      <path class="ar" transform="translate(${ax} 0)" d="M0 ${-r}L${r * .78} ${r * .86}L0 ${r * .45}L${-r * .78} ${r * .86}Z" fill="${MODE[k].ci}"/>
      <text x="${ax + aw / 2 + gap}" y="${fs * .36}" font-family="${SYS}" font-weight="700" font-size="${fs}" fill="${MODE[k].ci}">${txt}</text></g>`;
  };
  $("citymap").innerHTML = `
    <img class="mapimg light" src="media/map/site-map-light.jpg" alt="" onerror="this.remove()">
    <img class="mapimg dark" src="media/map/site-map-dark.jpg" alt="" onerror="this.remove()">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path id="vm0" d="${pathXY(t4pts)}" fill="none" stroke="var(--tram)" stroke-width="${5 * K}" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="vm1" d="${pathXY([...t4pts].reverse())}" fill="none" stroke="none"/>
      ${others.map((l, k) => `<path id="vo${k}" d="${path(l.pts)}" fill="none" stroke="none"/>`).join("")}
      ${places}${stopMarks}
      ${others.map((l, k) => capsule(l, `vo${k}`, (k * .37) % 1, false)).join("")}
      ${[0, 1].map((k) => capsule(t4, `vm${k}`, .05 + k * .3, true) + capsule(t4, `vm${k}`, .55 + k * .3, true)).join("")}
    </svg>
    <div class="feat" style="left:3%;top:7%"><span class="fi">${APPIN}</span><div>${f.pin[0]}<small>${f.pin[1]}</small></div></div>
    <div class="feat" style="right:3%;top:7%"><span class="fi">${badge("tram", "4")}</span><div>${f.star[0]}<small>${f.star[1]}</small></div></div>
    <div class="feat" style="left:3%;bottom:7%"><span class="fi" style="color:var(--tram)">${S("bell.fill")}</span><div>${f.bell[0]}<small>${f.bell[1]}</small></div></div>
    <div class="feat" style="right:3%;bottom:7%"><span class="fi">${S("figure.walk")}</span><div>${f.swap[0]}<small>${f.swap[1]}</small></div></div>`;
  // The trams stop at the T4 stops; the others at any known stop on their way.
  const allStops = [...[...stopAt.values()].map((v) => v.q), ...Object.values(d.labels).flat().map(([la, lo]) => P(la, lo))];
  mapMotion(allStops);
}

/* Vehicles drive like in the app: speed up, slow down, wait at a stop, drive on. */
let mapRun = 0;
function mapMotion(allStops) {
  const run = ++mapRun, svg = document.querySelector("#citymap svg");
  if (!svg) return;
  const ease = (t) => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  const vs = [...svg.querySelectorAll(".veh")].map((g) => {
    const path = svg.getElementById(g.dataset.path), L = path.getTotalLength(), big = !!g.dataset.big;
    // Stops on this path: sample it, keep each stop that lies on it (within a few units).
    const smp = []; for (let s = 0; s <= L; s += 4) { const q = path.getPointAtLength(s); smp.push([s, q.x, q.y]); }
    const on = [];
    allStops.forEach(([x, y]) => {
      let best = null; smp.forEach(([s, px, py]) => { const dd = Math.hypot(px - x, py - y); if (!best || dd < best[1]) best = [s, dd]; });
      if (best && best[1] < (big ? 16 : 10) && best[0] > 20 && best[0] < L - 20 && !on.some((o) => Math.abs(o - best[0]) < 60)) on.push(best[0]);
    });
    on.sort((a, b) => a - b);
    const marks = [0, ...on, L];
    const ar = g.querySelector(".ar"), ax = ar ? +ar.getAttribute("transform").match(/translate\(([-\d.]+)/)[1] : 0;
    return { g, path, L, marks, ar, ax, speed: big ? 46 : 54, leg: 0, t0: null, wait: 0, start: +g.dataset.start };
  });
  // Start each one part way along, at a stop.
  vs.forEach((v) => { v.leg = Math.min(v.marks.length - 2, Math.floor(v.start * (v.marks.length - 1))); });
  let last = performance.now();
  (function frame(now) {
    if (run !== mapRun) return;
    const dt = Math.min(100, now - last); last = now;
    const box = svg.getBoundingClientRect();
    const seen = box.bottom > 0 && box.top < innerHeight;
    vs.forEach((v) => {
      if (!seen) { if (v.t0 !== null) v.t0 += dt; return; }
      if (v.t0 === null) v.t0 = now - 400;
      const a = v.marks[v.leg], b = v.marks[v.leg + 1], dur = (b - a) / v.speed * 1000 + 1200, dwell = 2200;
      let t = (now - v.t0) / dur, s;

          v.leg++; v.t0 = now;
          if (v.leg >= v.marks.length - 1) v.leg = 0;
        }
      } else s = a + (b - a) * ease(Math.max(0, t));
      const q = v.path.getPointAtLength(s), q2 = v.path.getPointAtLength(Math.min(v.L, s + 3)), q1 = v.path.getPointAtLength(Math.max(0, s - 3));
      v.g.setAttribute("transform", `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})`);
      const deg = Math.atan2(q2.x - q1.x, q1.y - q2.y) * 180 / Math.PI;
      if (v.ar) v.ar.setAttribute("transform", `translate(${v.ax} 0) rotate(${deg.toFixed(0)})`);
      // fade in at the start of the line, out at its end
      const edge = Math.min(s, v.L - s);
      v.g.setAttribute("opacity", Math.max(0, Math.min(1, edge / 40)).toFixed(2));
    });
    requestAnimationFrame(frame);
  })(last);
}

/* ---------- the rows' pictures ---------- */
function rowVisual(i) {
  const t = T[lang];
  if (i === 0) return `<div class="vis big" id="bigVis"><div class="zoom">${badge("tram", "2").replace('class="badge"', 'class="badge"')}<span class="to">Kopli</span><span class="min">3 min</span></div><span class="aa"><small>A</small><span style="font-size:26px">A</span></span></div>`;
  if (i === 1) return `<div class="vis priv"><div class="tags">${t.priv.map((p, n) => `<span style="left:7%;top:${24 + n * 20}%">${p}</span>`).join("")}</div><div class="vault" style="margin-left:42%"><svg class="lk" viewBox="0 0 64 64" width="66" height="66"><path class="shk" d="M20 30V20a12 12 0 0 1 24 0v10" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><rect x="12" y="28" width="40" height="30" rx="8" fill="currentColor"/><circle cx="32" cy="41" r="4.5" fill="var(--paper)"/><rect x="30" y="42" width="4" height="8" rx="2" fill="var(--paper)"/></svg></div></div>`;
  if (i === 2) return `<div class="vis ios">
      <div class="island"><span class="l"><span class="chip">${S("bus.fill")}54</span></span><span class="r" id="isl">3 min</span></div>
      <div class="lock"><div class="top"><div>Jalami<small>Bus 54 · 4 stops</small></div><div class="big" id="lockMin">24:56</div></div>
        <div class="track"><i id="lockP"></i><b style="left:30%"></b><b style="left:55%"></b><b style="left:80%"></b></div></div>
      <div class="widget"><div class="h">${S("tram.fill")}Volta</div>
        <div class="r"><span class="n" style="background:var(--tram)">2</span>Kopli<span class="m" id="w1">3</span></div>
        <div class="r"><span class="n" style="background:var(--tram)">4</span>Ülemiste<span class="m">9</span></div>
        <div class="r"><span class="n" style="background:var(--bus);color:var(--busInk)">36</span>Viru<span class="m">12</span></div></div>
    </div>`;
  return `<div class="vis lang"><div class="words" id="words">${t.words.map((w, n) => `<span style="transform:translateY(${n * 110}%);opacity:${n ? 0 : 1}">${w}</span>`).join("")}</div></div>`;
}
let wordI = 0, lockS = 24 * 60 + 56;
setInterval(() => {
  const ws = document.querySelectorAll("#words span");
  if (ws.length) { wordI = (wordI + 1) % ws.length; ws.forEach((w, n) => { const d = (n - wordI + ws.length) % ws.length; w.style.transform = `translateY(${d === 0 ? 0 : d === 1 ? 110 : -110}%)`; w.style.opacity = d === 0 ? 1 : 0; }); }
  const big = $("bigVis"); if (big) big.classList.toggle("pulse");
}, 2200);
setInterval(() => {
  lockS = lockS > 20 ? lockS - 1 : 24 * 60 + 56;
  const m = $("lockMin"); if (m) m.textContent = `${Math.floor(lockS / 60)}:${String(lockS % 60).padStart(2, "0")}`;
  const p = $("lockP"); if (p) p.style.width = (100 - lockS / (24 * 60 + 56) * 70) + "%";
}, 1000);

/* ---------- words ---------- */
/* The thanks capsule: the app's rider badge, winking every 3 s. */
setInterval(() => { const c = $("ridecap"); if (!c || reduce) return; c.classList.add("wink"); setTimeout(() => c.classList.remove("wink"), 380); }, 3000);
/* Visits: GoatCounter (no cookies, no personal data). GC is the site's code there, empty
   until the account exists, so nothing is counted yet. The owner's screen: tap the HOPHIO
   logo six times quickly. */
const GC = "";
if (GC) { const sc = document.createElement("script"); sc.async = true; sc.src = "https://gc.zgo.at/count.js"; sc.dataset.goatcounter = `https://${GC}.goatcounter.com/count`; document.head.appendChild(sc); }
let logoTaps = [];
async function ownerScreen() {
  let box = $("owner");
  if (!box) { box = document.createElement("div"); box.id = "owner"; document.body.appendChild(box); box.onclick = (e) => { if (e.target === box) box.remove(); }; }
  const row = (k, v) => `<div class="r"><span>${k}</span><b>${v}</b></div>`;
  let body = "";
  if (!GC) body = `<p>Counter is not connected yet. Make a free account at goatcounter.com, then put its code into GC in index.html.</p>`;
  else {
    body = row("Visits", "…");
    box.innerHTML = `<div class="sheet"><h3>HOPHIO · owner</h3>${body}</div>`;
    try {
      const get = async (path) => (await (await fetch(`https://${GC}.goatcounter.com/counter/${encodeURIComponent(path)}.json`)).json()).count;
      body = row("All pages", await get("TOTAL")) + row("Home page", await get("/")) + row("“On my way” cards", await get("/w.html")) + row("Shared ways", await get("/r.html"));
    } catch (e) { body = `<p>Could not read the numbers. In GoatCounter settings, allow “visitor counts on your website”.</p>`; }
    body += `<p><a href="https://${GC}.goatcounter.com" target="_blank" rel="noopener">Open the full statistics</a></p>`;
  }
  box.innerHTML = `<div class="sheet"><h3>HOPHIO · owner</h3>${body}<button onclick="this.closest('#owner').remove()">Close</button></div>`;
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".brand")) return;
  const now = performance.now(); logoTaps = logoTaps.filter((t) => now - t < 3000); logoTaps.push(now);
  if (logoTaps.length >= 6) { logoTaps = []; e.preventDefault(); ownerScreen(); }
});
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { const k = el.dataset.t; if (typeof t[k] === "string") el.textContent = t[k]; });
  $("h1").innerHTML = t.h1.map((l, i) => `<span class="ln"><span${i === 2 ? ' class="paint"' : ""}>${l}</span></span>`).join("");
  $("lead").innerHTML = t.lead; $("status").innerHTML = t.status;
  $("langs").innerHTML = ["et", "en", "ru"].map((l) => `<button class="lang" type="button" aria-pressed="${l === lang}" data-lang="${l}">${l.toUpperCase()}</button>`).join("");
  document.querySelectorAll(".lang").forEach((b) => b.onclick = () => {
    lang = b.dataset.lang; try { localStorage.setItem("hophio.lang", lang); } catch (e) {}
    render(); requestAnimationFrame(placeStory);
  });
  loadShots(); buildCards();
  $("modes").innerHTML = Object.keys(MODE).map((k) => `<div class="mode rv"><div class="ic" style="--c:${MODE[k].c};--ci:${MODE[k].ci}">${modeIcon(k)}</div><div><h4>${t.modes[k][0]}</h4><p>${t.modes[k][1]}</p></div></div>`).join("");
  cityMap();
  const WHY = [["dot.radiowaves.left.and.right", "var(--bus)", "var(--busInk)"], ["bell.fill", "var(--tram)", "#fff"], ["lock.iphone", "var(--ink)", "var(--paper)"], ["wifi", "var(--trolley)", "#fff"], ["tram.fill", "var(--county)", "#fff"], ["calendar", "#ff3b30", "#fff"], ["square.and.arrow.up", "var(--bus)", "var(--busInk)"], ["apps.iphone", "var(--trolley)", "#fff"], ["wheelchair.svg", "#0a84ff", "#fff"]];
  // Six that the page says nowhere else (exit alert, Lock Screen and widget have their own places).
  const KEEP = [0, 3, 4, 5, 6, 8];
  $("whys").innerHTML = t.whys.map((w, i) => [w, i]).filter(([, i]) => KEEP.includes(i)).map(([[h, p], i]) => `<div class="why rv"><div class="ic" style="--c:${WHY[i][1]};--ci:${WHY[i][2]}">${S(WHY[i][0])}</div><h4>${h}</h4><p>${p}</p></div>`).join("");
  $("ridecap").innerHTML = FACE + "HOPHIO";
  $("legal").innerHTML = ["privacy", "terms", "support"].map((k, i) => `<a href="${k}/?lang=${lang}">${t.legal[i]}</a>`).join("") +
    `<a href="mailto:soundshare.support@gmail.com">soundshare.support@gmail.com</a>`;
  $("nexts").innerHTML = t.nexts.map(([sy, h, p]) => `<div class="nx rv"><span class="ic">${S(sy)}</span><div><h4>${h}</h4><p>${p}</p></div></div>`).join("");
  $("plans").innerHTML = t.plans.map(([n, pr, per, items], i) => `<div class="plan rv${i ? " plus" : ""}"><div class="nm">${i ? `<img src="media/apps/hophio.png" alt="" width="30" height="30" style="border-radius:8px">` : ""}${n}</div>
      <div class="pr">${pr}${per ? `<small>${per}</small>` : ""}</div><ul>${items.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  $("rows").innerHTML = t.rows.map(([h, p], i) => `<div class="row rv"><div><h3>${h}</h3><p>${p}</p></div>${rowVisual(i)}</div>`).join("");
  renderApps(t);
  observeReveal();
}
function renderApps(t) {
  $("appList").innerHTML = APPS.map((a) => {
    const inner = `<img class="ico" src="${a.icon || `media/apps/${a.id}.png`}" alt="${a.name}" width="112" height="112" loading="lazy"><h4>${a.name}</h4><p>${t.apps[a.id]}</p>`;
    return a.url ? `<a class="app rv" href="${a.url}" target="_blank" rel="noopener">${inner}<span class="store">${APPLE}${t.store}</span></a>`
                 : `<div class="app soon rv${a.status === "dev" ? " dev" : ""}">${inner}<span class="store soon">${a.status === "dev" ? '<span class="dot"></span>' + t.dev : APPLE + (a.status === "review" ? t.review : t.soon)}</span></div>`;
  }).join("");
}
const rio = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); rio.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
function observeReveal() { document.querySelectorAll(".rv:not(.in)").forEach((el) => rio.observe(el)); }

$("year").textContent = new Date().getFullYear();
render(); placeStory(); story();
// The apps list lives in apps.json (the HOPHIO app reads the same file): one place to edit.
// The list above is only the first paint and the fallback without the file.
fetch("apps.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((d) => {
  if (!d || !Array.isArray(d.apps) || !d.apps.length) return;
  APPS = d.apps.map((a) => ({ id: a.id, name: a.name, icon: a.icon,
    url: a.appStoreId ? `https://apps.apple.com/app/id${a.appStoreId}` : "", status: a.status }));
  for (const l of Object.keys(T)) for (const a of d.apps) {
    const txt = (a.about || {})[l] || (a.about || {}).en;
    if (txt) T[l].apps[a.id] = txt;
  }
  renderApps(T[lang]);
  // Already on screen: show the new cards at once (no second reveal animation).
  document.querySelectorAll("#appList .rv").forEach((el) => el.classList.add("in"));
}).catch(() => {});
// Open at the top (a reload kept the old place and cut the title on phones).
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
if (!location.hash) scrollTo(0, 0);
</script>
</body>
